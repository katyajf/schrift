<!-- Paste into Supabase → Authentication → Emails → Templates → "Magic link".
     Subject: Sign in to Schrift -->
<h2>Sign in to Schrift</h2>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email">Open Schrift</a></p>
<p>Or enter this code in the app:</p>
<p style="font-size: 28px; letter-spacing: 6px; font-family: monospace;">{{ .Token }}</p>
<p style="color: #7d766b;">If you didn't ask for this, you can ignore this email.</p>
